name: rag
description: 基于 Markdown 知识库回答问题，返回带来源的检索片段。
execution:
  mode: worker
  max_turns: 6
  timeout_seconds: 90
extension:
  module: subagents.rag.extension
model:
  llm_role: executor
  embedding_role: embedding
memory:
  namespaces:
    - project
    - subagent:rag
routing_hints:
  - Markdown 知识库问答
  - 文档检索、资料查询、原文依据
  - RAG、知识库、论坛资料
