name: rag
description: 基于 Markdown 知识库回答问题，返回带来源的检索片段。
execution:
  mode: worker
  max_turns: 6
  timeout_seconds: 90
extension:
  module: subagents.rag.extension
capabilities:
  - rag.search
policies:
  rag:
    max_top_k: 10
    require_source_metadata: true
  subagent:
    allow_recursive_calls: false
output_contract:
  format: json
  required_fields:
    - answer
    - artifacts
    - trace
  artifact_types:
    - rag_chunks
memory:
  namespaces:
    - project
    - subagent:rag
routing_hints:
  - Markdown 知识库问答
  - 文档检索、资料查询、原文依据
  - RAG、知识库、论坛资料
suggested_questions:
  - text: 总结知识库中与当前问题相关的资料
    reason: 知识库检索
