name: rag
description: 基于 PDF 知识库回答问题，返回带来源的检索片段。
execution:
  mode: worker
  max_turns: 6
  timeout_seconds: 90
runtime_env:
  kind: local
  setup_module: subagents.rag.env
  mode: lazy
tools:
  - search_knowledge_base
memory:
  namespaces:
    - project
    - subagent:rag
data:
  roots:
    - subagents/rag/data
  globs:
    - "*.pdf"
routing_hints:
  - PDF 知识库问答
  - 文档检索、资料查询、原文依据
  - RAG、知识库、论坛资料
