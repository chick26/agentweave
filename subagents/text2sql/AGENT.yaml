name: text2sql
description: 使用自然语言查询结构化数据，生成并执行只读 SQL。
execution:
  mode: worker
  max_turns: 8
extension:
  module: subagents.text2sql.extension
model:
  llm_role: executor
memory:
  namespaces:
    - project
    - skill:text2sql
domains:
  file: domain_catalog.yaml
routing_hints:
  - 数据库查询、SQL、结构化数据
  - IDC 资源、机房、机柜、服务器
  - 海缆故障、维修、影响城市
