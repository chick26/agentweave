[project]
name = "text2sql-agent"
version = "0.2.0"
description = "Subagent-driven data query agent with loadable skills."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.3",
    "openai>=2.18.0",
    "openai-agents>=0.6.0",
    "pyyaml>=6.0",
    "streamlit>=1.42.0",
    "uvicorn>=0.46.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project.scripts]
agentweave-server = "agent_runtime.server.__main__:main"
agentweave-prepare-text2sql = "subagents.text2sql.prepare.sqlite:main"
agentweave-prepare-rag = "subagents.rag.prepare.index:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = [
    "agent_runtime*",
    "subagents*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
